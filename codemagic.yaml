workflows:
  pellazgo-ios-workflow:
    name: Pellazgo Shop iOS - TestFlight & App Store
    max_build_duration: 60
    integrations:
      app_store_connect: pellazgo_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pellazgo.pellazgo
      xcode: latest
      vars:
        APP_ID: "6782613978"
        BUNDLE_ID: "com.pellazgo.pellazgo"
        XCODE_PROJECT: "mobile-app-swift/Pellazgo.xcodeproj"
        XCODE_SCHEME: "Pellazgo"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Increment build number
        script: |
          #!/bin/zsh
          set -e
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null || \
                   app-store-connect get-latest-app-store-build-number "$APP_ID" 2>/dev/null || \
                   echo "0")
          cd "$CM_BUILD_DIR/mobile-app-swift"
          agvtool new-version -all $(( LATEST + 1 ))

      - name: Set up code signing
        script: |
          #!/bin/zsh
          set -e
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Build IPA
        script: |
          #!/bin/zsh
          set -e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

      - name: Publish to App Store Connect (with retry)
        script: |
          #!/bin/zsh
          set -e
          IPA_PATH=$(find "$CM_BUILD_DIR/build/ios/ipa" -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: no IPA found to publish"
            exit 1
          fi
          echo "Publishing $IPA_PATH"

          MAX_ATTEMPTS=5
          ATTEMPT=1
          until app-store-connect publish \
            --path "$IPA_PATH" \
            --testflight \
            --app-store \
            --release-type AFTER_APPROVAL
          do
            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "ERROR: publish failed after $ATTEMPT attempts"
              exit 1
            fi
            WAIT=$(( ATTEMPT * 30 ))
            echo "Publish attempt $ATTEMPT failed (likely a transient Apple ASC API error, e.g. list-apps 500). Retrying in ${WAIT}s..."
            sleep "$WAIT"
            ATTEMPT=$(( ATTEMPT + 1 ))
          done
          echo "Publish succeeded on attempt $ATTEMPT"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Logs/gym/*.log
