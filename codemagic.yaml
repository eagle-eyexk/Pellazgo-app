workflows:

  pellazgo-ios-development:

    name: Pellazgo iOS Development IPA

    max_build_duration: 40

    instance_type: mac_mini_m2

    integrations:
      app_store_connect: pellazgo_asc

    environment:

      xcode: latest

      ios_signing:
        distribution_type: development
        bundle_identifier: com.pellazgo.pellazgo

      vars:
        XCODE_PROJECT: mobile-app-swift/Pellazgo.xcodeproj
        XCODE_SCHEME: Pellazgo


    scripts:

      - name: Checkout verification
        script: |
          #!/bin/zsh
          set -e

          echo "Repository:"
          pwd

          ls -la mobile-app-swift


      - name: Verify Bundle Identifier
        script: |
          #!/bin/zsh
          set -e

          cd "$CM_BUILD_DIR/mobile-app-swift"

          BUNDLE=$(xcodebuild \
            -project Pellazgo.xcodeproj \
            -scheme Pellazgo \
            -showBuildSettings | \
            grep PRODUCT_BUNDLE_IDENTIFIER | \
            awk '{print $3}')

          echo "Detected Bundle ID: $BUNDLE"

          if [ "$BUNDLE" != "com.pellazgo.pellazgo" ]; then
            echo "ERROR: Bundle ID mismatch"
            exit 1
          fi


      - name: Configure signing
        script: |
          #!/bin/zsh
          set -e

          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT"


      - name: Build Development IPA
        script: |
          #!/bin/zsh
          set -e

          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Debug


    artifacts:

      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Logs/gym/*.log



  pellazgo-ios-testflight:


    name: Pellazgo iOS TestFlight Release


    max_build_duration: 60


    instance_type: mac_mini_m2


    integrations:

      app_store_connect: pellazgo_asc


    triggering:

      events:
        - push

      branch_patterns:
        - pattern: main
          include: true



    environment:

      xcode: latest

      ios_signing:

        distribution_type: app_store

        bundle_identifier: com.pellazgo.pellazgo


      vars:

        APP_STORE_APP_ID: "6782613978"

        XCODE_PROJECT: mobile-app-swift/Pellazgo.xcodeproj

        XCODE_SCHEME: Pellazgo



    scripts:


      - name: Verify Bundle Identifier

        script: |
          #!/bin/zsh
          set -e

          cd "$CM_BUILD_DIR/mobile-app-swift"

          BUNDLE=$(xcodebuild \
            -project Pellazgo.xcodeproj \
            -scheme Pellazgo \
            -showBuildSettings | \
            grep PRODUCT_BUNDLE_IDENTIFIER | \
            awk '{print $3}')

          echo "Detected Bundle ID: $BUNDLE"

          if [ "$BUNDLE" != "com.pellazgo.pellazgo" ]; then
            echo "ERROR: Bundle ID mismatch"
            exit 1
          fi



      - name: Increment Build Number

        script: |
          #!/bin/zsh
          set -e

          cd "$CM_BUILD_DIR/mobile-app-swift"

          CURRENT=$(app-store-connect \
            get-latest-testflight-build-number \
            "$APP_STORE_APP_ID" 2>/dev/null || echo 0)

          NEXT=$((CURRENT + 1))

          echo "Setting build number: $NEXT"

          agvtool new-version -all "$NEXT"



      - name: Configure signing

        script: |
          #!/bin/zsh
          set -e

          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT"



      - name: Build Release IPA

        script: |
          #!/bin/zsh
          set -e

          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release



      - name: Upload to TestFlight

        script: |
          #!/bin/zsh
          set -e

          IPA=$(find "$CM_BUILD_DIR" -name "*.ipa" | head -1)

          if [ -z "$IPA" ]; then
            echo "No IPA found"
            exit 1
          fi

          echo "Uploading $IPA"

          app-store-connect publish \
            --path "$IPA" \
            --testflight



    artifacts:

      - build/ios/ipa/*.ipa

      - /tmp/xcodebuild_logs/*.log

      - $HOME/Library/Logs/gym/*.log



    publishing:

      email:

        recipients:

          - team@pellazgo.com

        notify:

          success: true

          failure: true
