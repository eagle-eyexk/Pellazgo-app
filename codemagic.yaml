workflows:
  pellazgo-ios-workflow:
    name: Pellazgo Shop iOS - TestFlight & App Store
    max_build_duration: 60
    integrations:
      app_store_connect: pellazgo_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pellazgo.pellazgo
      xcode: latest
      vars:
        APP_ID: "6782613978"
        BUNDLE_ID: "com.pellazgo.pellazgo"
        XCODE_PROJECT: "mobile-app-swift/Pellazgo.xcodeproj"
        XCODE_SCHEME: "Pellazgo"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Increment build number
        script: |
          #!/bin/zsh
          set -e
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null || \
                   app-store-connect get-latest-app-store-build-number "$APP_ID" 2>/dev/null || \
                   echo "0")
          cd "$CM_BUILD_DIR/mobile-app-swift"
          agvtool new-version -all $(( LATEST + 1 ))

      - name: Set up code signing
        script: |
          #!/bin/zsh
          set -e
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Build IPA
        script: |
          #!/bin/zsh
          set -e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Logs/gym/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
        release_type: AFTER_APPROVAL
