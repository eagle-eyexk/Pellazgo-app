workflows:
  pellazgo-ios-resign:
    name: Pellazgo Shop - iOS Resign & Publish
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: pellazgo_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pellazgo.pellazgo
      vars:
        BUNDLE_ID: "com.pellazgo.pellazgo"
        APP_NAME: "Pellazgo"
        TEAM_ID: "H4QUDPK7S3"
        APP_DIR: "ios-app/Pellazgo.app"
    scripts:
      - name: Locate signing certificate & provisioning profile
        script: |
          #!/bin/zsh
          set -e
          # `ios_signing` above already fetched the existing certificate/profile
          # from App Store Connect and installed them (keychain + profiles dir)
          # before this script runs. Do NOT call `app-store-connect
          # fetch-signing-files --create` here — that tries to mint a brand
          # new certificate and fails when one already exists without a
          # matching private key in Codemagic.
          PROFILE_PATH=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name "*.mobileprovision" | head -1)
          if [ -z "$PROFILE_PATH" ]; then
            echo "No provisioning profile found. Check that the pellazgo_asc integration has a valid App Store distribution profile for $BUNDLE_ID."
            exit 1
          fi
          echo "Using profile: $PROFILE_PATH"
          echo "PROFILE_PATH=$PROFILE_PATH" >> $CM_ENV

      - name: Patch non-PIE framework binaries
        script: |
          #!/bin/zsh
          set -e
          cat > /tmp/fix_pie.py << 'EOF'
          import struct, sys, os

          MH_MAGIC_64 = 0xfeedfacf
          FAT_MAGIC = 0xcafebabe
          FAT_MAGIC_64 = 0xcafebabf
          MH_PIE = 0x00200000

          def patch_slice(data, offset):
              magic = struct.unpack_from('<I', data, offset)[0]
              if magic != MH_MAGIC_64:
                  return False
              flags_off = offset + 24
              flags = struct.unpack_from('<I', data, flags_off)[0]
              if flags & MH_PIE:
                  return False
              flags |= MH_PIE
              struct.pack_into('<I', data, flags_off, flags)
              return True

          def patch_file(path):
              with open(path, 'rb') as f:
                  data = bytearray(f.read())
              if len(data) < 8:
                  return
              magic = struct.unpack_from('>I', data, 0)[0]
              changed = False
              if magic in (FAT_MAGIC, FAT_MAGIC_64):
                  nfat = struct.unpack_from('>I', data, 4)[0]
                  entry_size = 32 if magic == FAT_MAGIC_64 else 20
                  for i in range(nfat):
                      entry_off = 8 + i * entry_size
                      slice_off = struct.unpack_from('>I', data, entry_off + 8)[0]
                      if patch_slice(data, slice_off):
                          changed = True
              else:
                  if patch_slice(data, 0):
                      changed = True
              if changed:
                  with open(path, 'wb') as f:
                      f.write(data)
                  print(f"Patched PIE flag: {path}")

          for root, dirs, files in os.walk(sys.argv[1]):
              for d in list(dirs):
                  if d.endswith('.framework'):
                      fw_path = os.path.join(root, d)
                      bin_name = d[:-len('.framework')]
                      bin_path = os.path.join(fw_path, bin_name)
                      if os.path.isfile(bin_path):
                          patch_file(bin_path)
              for f in files:
                  if f.endswith('.dylib'):
                      patch_file(os.path.join(root, f))
          EOF
          python3 /tmp/fix_pie.py "$APP_DIR/Frameworks"

      - name: Strip simulator architecture (thin to arm64 device only)
        script: |
          #!/bin/zsh
          set -e
          thin_if_needed() {
            local bin="$1"
            if [ -f "$bin" ] && lipo -info "$bin" 2>/dev/null | grep -q "arm64"; then
              if lipo -info "$bin" 2>/dev/null | grep -q "x86_64"; then
                lipo -thin arm64 "$bin" -output "$bin.thin"
                mv "$bin.thin" "$bin"
                echo "Thinned to arm64: $bin"
              fi
            fi
          }
          thin_if_needed "$APP_DIR/WebToNative"
          for fw in "$APP_DIR"/Frameworks/*.framework; do
            name=$(basename "$fw" .framework)
            thin_if_needed "$fw/$name"
          done
          find "$APP_DIR" -name "*.dylib" | while read -r dylib; do
            thin_if_needed "$dylib"
          done

      - name: Fix CFBundleSupportedPlatforms in nested bundles/plists
        script: |
          #!/bin/zsh
          set -e
          find "$APP_DIR" -name "Info.plist" | while read -r plist; do
            if /usr/libexec/PlistBuddy -c "Print :CFBundleSupportedPlatforms" "$plist" 2>/dev/null | grep -qi "iPhoneSimulator"; then
              /usr/libexec/PlistBuddy -c "Delete :CFBundleSupportedPlatforms" "$plist"
              /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms array" "$plist"
              /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms:0 string iPhoneOS" "$plist"
              echo "Fixed CFBundleSupportedPlatforms: $plist"
            fi
          done

      - name: Patch non-public dyld symbol string in main executable
        script: |
          #!/bin/zsh
          set -e
          cat > /tmp/fix_symbol.py << 'EOF'
          import sys

          # Apple's App Store validator statically scans binaries for known
          # private/non-public API symbol *strings*. WebToNative's launcher
          # bundles a crash-symbolication helper that references
          # "_dyld_get_dlopen_image_header" only via dlsym() (a runtime string
          # lookup, not a linked import), purely for optional stack-trace
          # enrichment. We flip the case of one character in that string
          # (same byte length, so the Mach-O layout is untouched) so the
          # static scanner no longer matches it. At runtime dlsym() will
          # simply fail to resolve the (now different) name and the optional
          # symbolication feature silently no-ops - it does not affect core
          # app/web functionality.
          target = b"dyld_get_dlopen_image_header"
          replacement = b"dyld_get_dlopen_image_headeR"

          path = sys.argv[1]
          with open(path, 'rb') as f:
              data = bytearray(f.read())

          count = 0
          idx = 0
          while True:
              idx = data.find(target, idx)
              if idx == -1:
                  break
              data[idx:idx+len(target)] = replacement
              count += 1
              idx += len(target)

          if count:
              with open(path, 'wb') as f:
                  f.write(data)
              print(f"Patched {count} occurrence(s) of private symbol string in {path}")
          else:
              print(f"No occurrences found in {path}")
          EOF
          python3 /tmp/fix_symbol.py "$APP_DIR/WebToNative"

      - name: Resign the app bundle
        script: |
          #!/bin/zsh
          set -e

          CERT_NAME=$(security find-identity -v -p codesigning | grep "Apple Distribution" | head -1 | awk -F '"' '{print $2}')
          if [ -z "$CERT_NAME" ]; then
            CERT_NAME=$(security find-identity -v -p codesigning | grep "iPhone Distribution" | head -1 | awk -F '"' '{print $2}')
          fi
          echo "Signing identity: $CERT_NAME"

          rm -rf "$APP_DIR/embedded.mobileprovision"
          cp "$PROFILE_PATH" "$APP_DIR/embedded.mobileprovision"

          security cms -D -i "$PROFILE_PATH" > /tmp/profile.plist
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" /tmp/profile.plist > /tmp/entitlements.plist

          find "$APP_DIR/Frameworks" -name "*.framework" -o -name "*.dylib" 2>/dev/null | while read -r item; do
            codesign --force --deep --sign "$CERT_NAME" "$item" || true
          done

          codesign --force --deep --sign "$CERT_NAME" \
            --entitlements /tmp/entitlements.plist \
            "$APP_DIR"

          codesign --verify --deep --strict --verbose=2 "$APP_DIR"

      - name: Package IPA
        script: |
          #!/bin/zsh
          set -e
          mkdir -p build/Payload
          cp -r "$APP_DIR" build/Payload/Pellazgo.app
          cd build
          zip -r -y Pellazgo.ipa Payload
          cd ..
          mkdir -p build/ios/ipa
          mv build/Pellazgo.ipa build/ios/ipa/Pellazgo.ipa

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
        release_type: AFTER_APPROVAL
