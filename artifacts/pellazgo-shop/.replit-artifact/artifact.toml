kind = "mobile"
previewPath = "/pellazgo/"
title = "Pellazgo Shop"
version = "1.0.0"
id = "artifacts/pellazgo-shop"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/pellazgo/" ]
localPort = 26233

[services.development]
run = "pnpm --filter @workspace/pellazgo-shop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pellazgo-shop", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/pellazgo-shop", "run", "serve" ]

[services.env]
PORT = "26233"
BASE_PATH = "/pellazgo/"
